# Levanta todo con: docker compose up --build
# Web: http://localhost:4200   API: http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: barberhub
      POSTGRES_USER: barberhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-barberhub}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barberhub -d barberhub"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/barberhub
      DATABASE_USER: barberhub
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-barberhub}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (mínimo 32 caracteres)}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: http://localhost:4200
    ports:
      - "8080:8080"

  web:
    build: ./frontend
    depends_on:
      - api
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      - "4200:80"

volumes:
  pgdata:
