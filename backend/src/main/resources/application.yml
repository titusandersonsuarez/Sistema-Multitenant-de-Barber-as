spring:
  application:
    name: barberhub-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/barberhub}
    username: ${DATABASE_USER:barberhub}
    password: ${DATABASE_PASSWORD:barberhub}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  # Detrás de nginx: toma la IP real de X-Forwarded-For solo si la conexión viene de un proxy interno.
  forward-headers-strategy: native
  error:
    # Nunca devolver mensajes de excepciones internas al cliente (clases, SQL, rutas).
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health

barberhub:
  jwt:
    # Obligatorio: sin JWT_SECRET (mínimo 32 caracteres) la API no arranca. Nunca pongas un valor por defecto aquí:
    # cualquiera que lea el repositorio podría firmar tokens de cualquier barbería.
    secret: ${JWT_SECRET:}
    expiration-hours: ${JWT_EXPIRATION_HOURS:12}
  superadmin:
    email: ${SUPERADMIN_EMAIL:}
    password: ${SUPERADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  demo:
    # Crea la barbería de ejemplo /barberia-demo al arrancar (para la demo pública).
    enabled: ${DEMO_ENABLED:false}
    email: ${DEMO_EMAIL:demo@barberhub.co}
    password: ${DEMO_PASSWORD:demo12345}
  booking:
    slot-step-minutes: 15
    max-days-ahead: 60
