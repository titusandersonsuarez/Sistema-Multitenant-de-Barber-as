spring:
  application:
    name: barberhub-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/barberhub}
    username: ${DATABASE_USER:barberhub}
    password: ${DATABASE_PASSWORD:barberhub}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health

barberhub:
  jwt:
    # En producción SIEMPRE definir JWT_SECRET (mínimo 32 caracteres).
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiration-hours: ${JWT_EXPIRATION_HOURS:12}
  superadmin:
    email: ${SUPERADMIN_EMAIL:}
    password: ${SUPERADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  booking:
    slot-step-minutes: 15
    max-days-ahead: 60
